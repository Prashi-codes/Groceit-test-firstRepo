<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Groceit Signup</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase v9 COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDo-lF9srWfiRXIl7qqldpI2NH4nPulNeM",
      authDomain: "groceit-d91f1.firebaseapp.com",
      projectId: "groceit-d91f1",
      storageBucket: "groceit-d91f1.appspot.com",
      messagingSenderId: "459230201918",
      appId: "1:459230201918:web:7ca369114fade01b60e96f"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <div class="background">
    <div class="login-container">
      <div class="logo-wrapper">
        <img src="groceit.png" alt="Groceit Logo" class="logo" />
      </div>
      <h2>Create your Groceit account</h2>
      <form id="signup-form">
        <div class="input-group">
          <input type="text" id="signup-name" required />
          <label for="signup-name">Full Name</label>
        </div>
        <div class="input-group">
          <input type="email" id="signup-email" required />
          <label for="signup-email">Email</label>
        </div>
        <div class="input-group">
          <input type="password" id="signup-password" required />
          <label for="signup-password">Password</label>
        </div>
        <div class="input-group">
          <input type="password" id="signup-confirm-password" required />
          <label for="signup-confirm-password">Confirm Password</label>
        </div>
        <button type="submit">Sign Up</button>
        <div class="switch-link">
          Already have an account? <a href="index.html">Login here</a>
        </div>
      </form>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
